name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-and-sdk:
    name: Backend & SDK (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracelens
          POSTGRES_PASSWORD: tracelens_password
          POSTGRES_DB: tracelens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx sqlalchemy aiosqlite redis pydantic pydantic-settings alembic pyjwt bcrypt

      - name: Quality Gate - Ruff Linting
        run: ruff check .

      - name: Test Suite & Coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key_testing_thirty_two_chars_minimum
        run: |
          pytest --cov=tracelens.backend.app --cov=tracelens.sdk.src.tracelens --cov-report=term-missing --cov-fail-under=80

  dashboard:
    name: Dashboard (Next.js 14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracelens/dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: tracelens/dashboard/package.json

      - name: Install Dependencies
        run: npm install

      - name: Quality Gate - ESLint
        run: npm run lint

      - name: Quality Gate - TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Production Build Check
        run: npm run build
